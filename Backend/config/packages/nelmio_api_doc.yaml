nelmio_api_doc:
    documentation:
        info:
            title: Harva API
            # description: This is an awesome app!
            version: 1.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - bearerAuth: []

    areas:
        path_patterns:
            - ^/api(?!/doc$)
