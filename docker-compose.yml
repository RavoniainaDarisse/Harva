services:
  backend:
    build:
      context: Backend
      dockerfile: docker/php/Dockerfile
    container_name: symfony_php
    volumes:
      - ./Backend:/var/www/html
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@database:3306/${DB_NAME}?serverVersion=${DB_VERSION}
    depends_on:
      database:
        condition: service_healthy
    env_file: .env

  frontend:
    image: node:20-alpine
    container_name: react_vite
    working_dir: /app
    volumes:
      - ./Automatique:/app
    command: ["sh", "-c", "npm install && npm run dev -- --host"]
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: symfony_nginx
    ports:
      - "8080:80"
    volumes:
      - ./Backend/public:/var/www/html/public:ro
      - ./Backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  database:
    image: mysql:8.0
    container_name: symfony_mysql
    restart: always
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      # MYSQL_USER: ${DB_USER}
      # MYSQL_PASSWORD: ${DB_PASSWORD}
      # MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5

volumes:
  db_data: